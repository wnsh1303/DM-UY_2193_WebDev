<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Contact Us Site 1</title>
    <meta name="description" content="Method 1 - Page Names in File Name">
</head>


<body>
    <!-- Place your Nav Links Here -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <h1>Contact Us</h1>
    <!-- Bonus - Place Images Here -->
    <img src="./img/chicken3.jpeg" alt="Chicken Image">
    <!-- Double Bonus - Make a Contact Form -->
    <form>
        <fieldset>
            <legend>Contact Form</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
            <br>
        </fieldset>
        <input type="submit" value="Submit">
    </form>

</body>

</html>
