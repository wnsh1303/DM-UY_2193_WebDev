<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Contact Us Site 2</title>
    <meta name="description" content="Method 2 - Each Page as Own Directory Folder with Index.html within">
</head>


<body>
    <!-- Place your Nav Links Here -->
    <nav>
        <!-- use UL LI and A for Nav Links within our NAV tag -->
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../about/index.html">About</a></li>
            <li><a href="index.html">Contact</a></li>
        </ul>
    </nav>
    <h1>Contact Us</h1>
    <!-- Bonus - Place Images Here -->
    <img src="../img/chicken3.jpeg" alt="Chicken Image"/>
  
    <!-- Double Bonus - Add Contact Form Here -->
    <form>
        <fieldset>
            <legend>Contact Form</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
            <br>
        </fieldset>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
